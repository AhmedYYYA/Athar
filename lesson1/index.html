<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0B2345">
  <title>ATHAR Lesson 1 — What Is AI?</title>
  <link rel="icon" href="../assets/favicon.svg">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip" href="#lesson">Skip to lesson</a>
  <header class="topbar">
    <a class="brand" href="../index.html" aria-label="ATHAR home">
      <img src="../assets/athar-symbol.svg" alt="" class="brand-symbol">
      <span class="brand-word">ATHAR <b>|</b> <span lang="ar">أثر</span></span>
    </a>
    <div class="lesson-title">
      <strong data-en="Lesson 1 — What Is AI?" data-ar="الدرس ١ — ما هو الذكاء الاصطناعي؟">Lesson 1 — What Is AI?</strong>
      <span id="stageCounter">Stage 00 / 09</span>
    </div>
    <nav class="controls" aria-label="Lesson preferences">
      <div class="seg" aria-label="Age pathway">
        <button class="age active" data-age="7-9">7–9</button>
        <button class="age" data-age="10-12">10–12</button>
      </div>
      <button id="listenBtn" class="icon-btn" type="button" aria-label="Listen to this screen">🎧 <span data-en="Listen" data-ar="استمع">Listen</span></button>
      <button id="langBtn" class="icon-btn" type="button" aria-label="Switch language">AR</button>
      <select id="companionSelect" aria-label="Choose companion">
        <option value="none">No companion</option>
        <option value="hamdan">Hamdan | حمدان</option>
        <option value="hessa">Hessa | حصه</option>
      </select>
    </nav>
  </header>

  <div class="journey" aria-label="Lesson journey">
    <div class="journey-labels">
      <span data-en="Find AI" data-ar="أتعرف إلى الذكاء الاصطناعي">Find AI</span>
      <span data-en="Understand AI" data-ar="أفهمه">Understand AI</span>
      <span data-en="Try AI" data-ar="أجرّبه">Try AI</span>
      <span data-en="Check AI" data-ar="أتحقق">Check AI</span>
      <span data-en="Use AI wisely" data-ar="أستخدمه بوعي">Use AI wisely</span>
    </div>
    <div class="progress-track"><div id="progressFill"></div></div>
  </div>

  <main id="lesson" class="lesson-shell" tabindex="-1">
    <section id="screen" class="screen" aria-live="polite"></section>
    <aside id="companion" class="companion" hidden>
      <img id="companionImg" alt="">
      <div id="companionBubble" class="bubble"></div>
    </aside>
  </main>

  <footer class="lesson-nav">
    <button id="backBtn" class="btn secondary" type="button">← <span data-en="Back" data-ar="رجوع">Back</span></button>
    <div id="evidenceStatus" class="evidence" aria-live="polite"></div>
    <button id="nextBtn" class="btn primary" type="button"><span data-en="Next" data-ar="التالي">Next</span> →</button>
  </footer>

  <template id="choiceTemplate">
    <button class="choice" type="button"><span class="choice-icon"></span><span class="choice-label"></span></button>
  </template>

  <script src="./app.js"></script>
</body>
</html>
