name: ATHAR Regression

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Run ATHAR regression suite
        run: npm test
      - name: Install Chromium for browser QA
        run: npx playwright install --with-deps chromium
      - name: Run real browser QA
        run: npm run test:browser
      - name: Upload browser QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athar-browser-qa-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
