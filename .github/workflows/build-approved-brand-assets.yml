name: Build approved ATHAR brand assets

on:
  push:
    branches: [main]
    paths:
      - 'assets/athar-approved-logo-base64.txt'
      - '.github/workflows/build-approved-brand-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-brand-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode approved master artwork
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, re
          src = Path('assets/athar-approved-logo-base64.txt').read_text(encoding='utf-8', errors='ignore')
          runs = re.findall(r'[A-Za-z0-9+/=]{1000,}', src)
          if not runs:
              raise SystemExit('No valid base64 payload found')
          payload = max(runs, key=len)
          data = base64.b64decode(payload + '===', validate=False)
          Path('assets/athar-approved-logo.jpg').write_bytes(data)
          print(f'Decoded {len(data)} bytes')
          PY

      - name: Verify decoded artwork
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/athar-approved-logo.jpg
          file assets/athar-approved-logo.jpg | grep -qi 'JPEG image data'
          sha256sum assets/athar-approved-logo.jpg > assets/athar-approved-logo.sha256

      - name: Generate exact-reference SVG wrappers
        shell: bash
        run: |
          cat > assets/athar-lockup.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="420" height="308" viewBox="0 0 420 308" role="img" aria-label="ATHAR approved master identity">
            <image href="athar-approved-logo.jpg" x="0" y="0" width="420" height="308" preserveAspectRatio="xMidYMid meet"/>
          </svg>
          EOF

          cat > assets/athar-symbol.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="245" height="250" viewBox="72 0 245 250" role="img" aria-label="ATHAR approved symbol">
            <image href="athar-approved-logo.jpg" x="0" y="0" width="420" height="308" preserveAspectRatio="none"/>
          </svg>
          EOF

      - name: Commit controlled assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/athar-approved-logo.jpg assets/athar-approved-logo.sha256 assets/athar-lockup.svg assets/athar-symbol.svg
          if git diff --cached --quiet; then
            echo "No asset changes to commit"
          else
            git commit -m "Use exact approved ATHAR artwork for SVG wrappers"
            git push
          fi
