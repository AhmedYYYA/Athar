name: Build approved ATHAR brand assets

on:
  push:
    branches: [main]
    paths:
      - 'assets/athar-approved-logo-base64.txt'
      - '.github/workflows/build-approved-brand-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-brand-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode approved master artwork
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, re
          src = Path('assets/athar-approved-logo-base64.txt').read_text(encoding='utf-8', errors='ignore')
          runs = re.findall(r'[A-Za-z0-9+/=]{1000,}', src)
          if not runs:
              raise SystemExit('No valid base64 payload found')
          payload = max(runs, key=len)
          data = base64.b64decode(payload + '===', validate=False)
          Path('assets/athar-approved-logo.jpg').write_bytes(data)
          print(f'Decoded {len(data)} bytes')
          PY

      - name: Verify decoded artwork
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/athar-approved-logo.jpg
          file assets/athar-approved-logo.jpg | grep -qi 'JPEG image data'
          sha256sum assets/athar-approved-logo.jpg > assets/athar-approved-logo.sha256

      - name: Generate Safari-compatible exact-reference SVG assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          data = Path('assets/athar-approved-logo.jpg').read_bytes()
          b64 = base64.b64encode(data).decode('ascii')
          uri = f'data:image/jpeg;base64,{b64}'
          lockup = f'''<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="420" height="308" viewBox="0 0 420 308" role="img" aria-labelledby="title desc">
<title id="title">ATHAR | أثر approved master identity</title><desc id="desc">Approved ATHAR bilingual logo artwork.</desc>
<image href="{uri}" xlink:href="{uri}" x="0" y="0" width="420" height="308" preserveAspectRatio="xMidYMid meet"/>
</svg>'''
          symbol = f'''<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="245" height="250" viewBox="72 0 245 250" role="img" aria-labelledby="title desc">
<title id="title">ATHAR approved symbol</title><desc id="desc">Approved ATHAR trace, child and learning-path symbol.</desc>
<image href="{uri}" xlink:href="{uri}" x="0" y="0" width="420" height="308" preserveAspectRatio="none"/>
</svg>'''
          Path('assets/athar-lockup.svg').write_text(lockup, encoding='utf-8')
          Path('assets/athar-symbol.svg').write_text(symbol, encoding='utf-8')
          PY

      - name: Validate SVG files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for p in [Path('assets/athar-lockup.svg'), Path('assets/athar-symbol.svg')]:
              ET.parse(p)
              text = p.read_text(encoding='utf-8')
              assert 'data:image/jpeg;base64,' in text
              assert 'xlink:href=' in text
              print(f'validated {p}')
          PY

      - name: Commit controlled assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/athar-approved-logo.jpg assets/athar-approved-logo.sha256 assets/athar-lockup.svg assets/athar-symbol.svg
          if git diff --cached --quiet; then
            echo "No asset changes to commit"
          else
            git commit -m "Harden approved ATHAR SVG assets for browser compatibility"
            git push
          fi
