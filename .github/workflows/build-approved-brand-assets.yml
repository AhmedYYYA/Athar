name: Validate ATHAR brand assets

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'manifest.webmanifest'
      - 'assets/**'
      - '.github/workflows/build-approved-brand-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-brand-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize approved v3 symbol from controlled source
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/brand/ATHAR_Approved_Symbol_v3.b64.txt
          base64 --decode assets/brand/ATHAR_Approved_Symbol_v3.b64.txt > assets/brand/ATHAR_Approved_Symbol_v3.jpg
          file assets/brand/ATHAR_Approved_Symbol_v3.jpg | grep -qi 'JPEG image data'
          test -s assets/brand/ATHAR_Approved_Symbol_v3.jpg

      - name: Verify required controlled assets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            assets/brand/ATHAR_Approved_Symbol_v3.jpg
            assets/brand/ATHAR_Approved_Symbol_v3.b64.txt
            assets/athar-approved-lockup.jpg
            assets/athar-approved-symbol.jpg
            assets/ui/explore.svg
            assets/ui/learn.svg
            assets/ui/create.svg
            assets/ui/impact.svg
            assets/ui/safety.svg
            assets/ui/skills.svg
          )
          for f in "${required[@]}"; do
            test -s "$f" || { echo "Missing or empty controlled asset: $f"; exit 1; }
            echo "present: $f"
          done

      - name: Verify approved Arabic spelling and application asset references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          js = Path('app.js').read_text(encoding='utf-8')
          if 'أثر' not in html + js:
              raise SystemExit('Approved Arabic wordmark spelling أثر not found in application text')
          refs = set(re.findall(r'(?:src|href)=["\'](assets/[^"\']+)["\']', html))
          manifest = Path('manifest.webmanifest').read_text(encoding='utf-8')
          refs.update(re.findall(r'"src"\s*:\s*"(assets/[^"]+)"', manifest))
          missing = sorted(r for r in refs if not Path(r).exists())
          if missing:
              raise SystemExit('Missing referenced assets: ' + ', '.join(missing))
          print('All referenced local assets exist')
          PY

      - name: Commit materialized approved symbol if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/brand/ATHAR_Approved_Symbol_v3.jpg && git ls-files --error-unmatch assets/brand/ATHAR_Approved_Symbol_v3.jpg >/dev/null 2>&1; then
            echo 'Approved symbol already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/brand/ATHAR_Approved_Symbol_v3.jpg
          git commit -m 'Materialize approved ATHAR v3 symbol asset'
          git push
