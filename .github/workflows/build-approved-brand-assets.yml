name: Validate ATHAR brand assets

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'manifest.webmanifest'
      - 'assets/**'
      - '.github/workflows/build-approved-brand-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-brand-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required controlled assets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            assets/athar-approved-lockup.jpg
            assets/athar-approved-symbol.jpg
            assets/athar-lockup.svg
            assets/athar-symbol.svg
            assets/favicon.svg
            assets/ui/explore.svg
            assets/ui/learn.svg
            assets/ui/create.svg
            assets/ui/impact.svg
            assets/ui/safety.svg
            assets/ui/skills.svg
          )
          for f in "${required[@]}"; do
            test -s "$f" || { echo "Missing or empty controlled asset: $f"; exit 1; }
            echo "present: $f"
          done

      - name: Validate SVG XML
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = [
              Path('assets/athar-lockup.svg'), Path('assets/athar-symbol.svg'),
              Path('assets/favicon.svg'), *sorted(Path('assets/ui').glob('*.svg'))
          ]
          for p in files:
              root = ET.parse(p).getroot()
              if not root.tag.endswith('svg'):
                  raise SystemExit(f'Not an SVG root: {p}')
              print(f'valid xml: {p}')
          PY

      - name: Verify approved Arabic spelling and asset references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          js = Path('app.js').read_text(encoding='utf-8')
          if 'أثر' not in html + js:
              raise SystemExit('Approved Arabic wordmark spelling أثر not found in application text')
          refs = set(re.findall(r'(?:src|href)=["\'](assets/[^"\']+)["\']', html))
          manifest = Path('manifest.webmanifest').read_text(encoding='utf-8')
          refs.update(re.findall(r'"src"\s*:\s*"(assets/[^"]+)"', manifest))
          missing = sorted(r for r in refs if not Path(r).exists())
          if missing:
              raise SystemExit('Missing referenced assets: ' + ', '.join(missing))
          print('All referenced local assets exist')
          PY

      - name: Reject obsolete ATHAR asset pipeline files
        shell: bash
        run: |
          set -euo pipefail
          for f in assets/athar-approved-logo.jpg assets/athar-approved-logo-base64.txt assets/athar-approved-logo.sha256; do
            if [ -e "$f" ]; then
              echo "Obsolete asset must be removed: $f"
              exit 1
            fi
          done
