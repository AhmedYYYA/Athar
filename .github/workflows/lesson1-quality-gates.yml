name: Lesson 1 quality gates

on:
  pull_request:
    paths:
      - 'lesson1.html'
      - 'lesson1.css'
      - 'lesson1.js'
      - 'lesson1-hardening.js'
      - 'LESSON1_PRODUCTION_QA.md'
      - '.github/workflows/lesson1-quality-gates.yml'
  push:
    branches: ['lesson-1-production-v1']

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check lesson1.js
          node --check lesson1-hardening.js
      - name: HTML structural parse
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser): pass
          P().feed(Path('lesson1.html').read_text())
          print('HTML parse OK')
          PY
      - name: Child-safety release invariants
        run: |
          grep -q "You remain the thinker" lesson1.js
          grep -q "trusted adult" lesson1-hardening.js
          grep -q "SIMULATION" lesson1.js
          grep -q "Keep private" lesson1.js
          ! grep -Eqi "streak|leaderboard|points|targeted ad|analytics" lesson1.html lesson1.js lesson1-hardening.js
      - name: Privacy and supply-chain invariants
        run: |
          ! grep -Eqi "google-analytics|googletagmanager|doubleclick|facebook\.net|hotjar|segment\.com" lesson1.html lesson1.js lesson1-hardening.js
          ! grep -Eqi "api[_-]?key|client[_-]?secret|bearer [A-Za-z0-9]" lesson1.html lesson1.js lesson1-hardening.js
          ! grep -Eqi "https?://" lesson1.html lesson1.js lesson1-hardening.js
      - name: Required accessibility hooks
        run: |
          grep -q "skip-link" lesson1.html
          grep -q "aria-live" lesson1.html
          grep -q "prefers-reduced-motion" lesson1.css
          grep -q "focus-visible" lesson1.css
          grep -q "progressbar" lesson1-hardening.js
      - name: Bilingual and age-depth invariants
        run: |
          grep -q "dir=state.lang==='ar'" lesson1.js
          grep -q "Tell me more" lesson1.js
          grep -q "10-12" lesson1.js
          grep -q "حصه" lesson1.html
