<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="t d">
<title id="t">ATHAR animated trace</title><desc id="d">Abstract flowing ATHAR colour motion.</desc>
<defs>
 <filter id="blur"><feGaussianBlur stdDeviation="32"/></filter>
 <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0EA7A1"/><stop offset=".36" stop-color="#178DCE"/><stop offset=".7" stop-color="#7457C8"/><stop offset="1" stop-color="#F7931E"/></linearGradient>
</defs>
<g filter="url(#blur)" opacity=".78">
 <circle cx="205" cy="220" r="118" fill="#0EA7A1"><animate attributeName="cx" values="205;310;205" dur="8s" repeatCount="indefinite"/><animate attributeName="cy" values="220;180;220" dur="7s" repeatCount="indefinite"/></circle>
 <circle cx="395" cy="225" r="108" fill="#7457C8"><animate attributeName="cx" values="395;330;395" dur="9s" repeatCount="indefinite"/><animate attributeName="cy" values="225;330;225" dur="6.5s" repeatCount="indefinite"/></circle>
 <circle cx="305" cy="390" r="105" fill="#F7931E"><animate attributeName="cx" values="305;225;305" dur="7.5s" repeatCount="indefinite"/><animate attributeName="cy" values="390;330;390" dur="8.5s" repeatCount="indefinite"/></circle>
 <circle cx="280" cy="290" r="92" fill="#178DCE"><animate attributeName="r" values="82;125;82" dur="6s" repeatCount="indefinite"/></circle>
</g>
<circle cx="300" cy="300" r="190" fill="none" stroke="url(#ring)" stroke-width="4" opacity=".48" stroke-dasharray="10 18"><animateTransform attributeName="transform" type="rotate" from="0 300 300" to="360 300 300" dur="18s" repeatCount="indefinite"/></circle>
<circle cx="300" cy="300" r="142" fill="rgba(255,255,255,.22)" stroke="rgba(255,255,255,.72)" stroke-width="2"/>
</svg>